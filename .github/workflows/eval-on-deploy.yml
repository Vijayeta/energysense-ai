name: RAG Eval Suite

# Vercel fires a deployment_status event on every preview and production deploy.
# This workflow runs the 15-point regression suite against the live deployment URL
# and fails the check if any eval fails — making "CI regression suite" factually true.
on:
  deployment_status:

permissions:
  contents: read

jobs:
  eval:
    name: "RAG evals — ${{ github.event.deployment_status.environment }}"
    runs-on: ubuntu-latest

    # Only run when Vercel marks the deployment as successful.
    # Remove the environment filter below if you want preview deploys checked too.
    if: >
      github.event.deployment_status.state == 'success' &&
      (
        github.event.deployment_status.environment == 'Production' ||
        github.event.deployment_status.environment == 'Preview'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Health check: wait up to 60 s for the deployment to be reachable.
      # Vercel fires deployment_status before edge propagation is fully complete,
      # so the first request can fail even on a successful deploy.
      - name: Wait for deployment to be reachable
        run: |
          URL="${{ github.event.deployment_status.target_url }}"
          echo "Deployment URL: $URL"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "Attempt $i/12 — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Deployment reachable."
              exit 0
            fi
            sleep 5
          done
          echo "Deployment not reachable after 60 s — aborting."
          exit 1

      - name: Run 15-point RAG regression evals
        run: |
          npx tsx scripts/eval-chat.ts \
            --base-url="${{ github.event.deployment_status.target_url }}" \
            --upload-id="${{ secrets.EVAL_UPLOAD_ID }}"

      # Always upload the JSON report, even when evals fail,
      # so you can inspect failures without re-running.
      - name: Upload eval report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.event.deployment_status.environment }}-run${{ github.run_number }}
          path: scripts/eval-report-*.json
          retention-days: 30
